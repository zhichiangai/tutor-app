name: V4 QA classification isolated PostgreSQL
on:
  pull_request:
    paths:
      - 'v2/payment-ledger.js'
      - 'v2/app.js'
      - 'v2/qa-ledger-synthetic.html'
      - 'supabase/candidates/*v4*qa*.sql'
      - 'tests/sql/v4_qa_*.sql'
      - 'tests/v4-qa-*.mjs'
      - '.github/workflows/v4-qa-isolated-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-classification-contract:
    name: disposable-postgres-qa-roles
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify Node candidate QA calculations
        run: |
          node --test tests/v4-qa-ledger-allocation-regression.mjs
          node --test tests/v4-qa-payment-classification-contract.mjs tests/v4-qa-lesson-classification-contract.mjs
      - name: Install PostgreSQL client if absent
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply candidate SQL only to disposable PostgreSQL fixture
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/sql/v4_qa_isolated_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/candidates/20261028_v4_payment_batch_qa_classification.sql
          psql -v ON_ERROR_STOP=1 -f supabase/candidates/20261029_v4_qa_lesson_and_legacy_receipt.sql
          psql -v ON_ERROR_STOP=1 -f supabase/candidates/20261029_v4_accounting_qa_snapshot_rpc.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/v4_qa_isolated_assertions.sql
