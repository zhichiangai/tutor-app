name: V3 Regression Tests
on:
  push:
    branches: ["main", "feat/v3-human-friendly-course-billing-guardian-20261020", "feat/v4-batch-corrections-foundation-20261024"]
  pull_request:
    branches: ["main", "feat/v4-bidirectional-invites-qr-gas-20261023", "feat/v4-qa-time-metadata-20261024"]
permissions:
  contents: read
jobs:
  browser-state-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tutoring V2/V3 regression suites
        run: node --test tests/*.mjs
