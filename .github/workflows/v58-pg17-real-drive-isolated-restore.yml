name: V5.8 PG17 real Drive isolated restore SYNTHETIC ONLY

on:
  pull_request:
    paths:
      - '.github/workflows/v58-pg17-real-drive-isolated-restore.yml'
      - 'tests/local/v58-pg17-drive-real-restore-synthetic.sh'
      - 'docs/v5/V58_PG17_REAL_DRIVE_SYNTHETIC_RESTORE_GATE_20261118.md'
  workflow_dispatch:
    inputs:
      safety_ack:
        description: 'SYNTHETIC_ONLY; NEVER production Supabase data'
        required: true
        type: choice
        options:
          - SYNTHETIC_ONLY

permissions:
  contents: read

concurrency:
  group: v58-pg17-real-drive-synthetic-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-pg17-mock-no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
      V58_PG17_MODE: mock
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install distribution age (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age >/dev/null
      - name: Shell syntax and isolated PostgreSQL17 mock transport restore
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/local/v58-pg17-drive-real-restore-synthetic.sh
          bash tests/local/v58-pg17-drive-real-restore-synthetic.sh

  protected-real-drive-pg17-synthetic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.safety_ack == 'SYNTHETIC_ONLY'
    environment: v58-gdrive-synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
      V58_PG17_MODE: real
      GDRIVE_CLIENT_ID: ${{ secrets.V58_GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.V58_GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.V58_GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ vars.V58_GDRIVE_SYNTHETIC_FOLDER_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install distribution age (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age >/dev/null
      - name: Real Drive API encrypted synthetic PG17 archive then isolated restore
        shell: bash
        run: |
          set -euo pipefail
          set +x
          bash -n tests/local/v58-pg17-drive-real-restore-synthetic.sh
          bash tests/local/v58-pg17-drive-real-restore-synthetic.sh
