name: V5.8 Drive 7-4-6 retention planner offline gate (NO DELETE)

on:
  pull_request:
    paths:
      - 'scripts/release/v58-gdrive-retention-plan.mjs'
      - 'tests/v58-gdrive-retention-plan.test.mjs'
      - '.github/workflows/v58-gdrive-retention-offline.yml'
      - 'docs/v5/V58_RETENTION_STANDALONE_GATE_20261118.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline 7 daily 4 weekly 6 monthly plus fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/v58-gdrive-retention-plan.test.mjs
