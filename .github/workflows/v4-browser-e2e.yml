name: V4 isolated Playwright browser E2E

on:
  pull_request:
    paths:
      - 'v2/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'supabase/candidates/**'
      - '.github/workflows/v4-browser-e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    name: disposable-supabase-chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      V4_E2E_LOCAL: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      V4_E2E_FIXTURE_FILE: /tmp/v4-e2e-fixture.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v3
        with:
          version: 2.107.0
      - name: Enforce disposable localhost scope
        run: |
          set -euo pipefail
          grep -q '^project_id = "tutor_v4_isolated"$' supabase/config.toml
          test ! -f supabase/.temp/project-ref
          test ! -f supabase/.branches/_current_branch
          test "$V4_E2E_LOCAL" = "1"
      - name: Start disposable Supabase and replay complete V4 plus V5 migrations
        run: |
          set -euo pipefail
          start_log="$RUNNER_TEMP/v4-browser-start.log"
          reset_log="$RUNNER_TEMP/v4-browser-reset.log"
          trap 'rm -f "$start_log" "$reset_log"' EXIT
          start_ok=0
          for attempt in 1 2 3; do
            # Previous failed startup can leave this *disposable* local project's
            # containers holding 54322/54324. Stop only the named localhost
            # project before retry; never operate a linked/hosted Supabase.
            if [ "$attempt" -gt 1 ]; then
              supabase stop --no-backup >/dev/null 2>&1 || true
            fi
            if supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >"$start_log" 2>&1; then
              start_ok=1
              break
            fi
            if grep -qiE '(toomanyrequests|too many requests|rate limit|429|address already in use|failed to bind host port)' "$start_log" && [ "$attempt" -lt 3 ]; then
              echo "::notice::Disposable Supabase startup retry (registry throttling or local port collision), attempt $attempt"
              sleep $((attempt * 20))
            else
              break
            fi
          done
          if [ "$start_ok" -ne 1 ]; then
            echo "::error::Disposable Supabase failed to start (raw output suppressed)"
            if grep -qiE '(rate limit|too many requests|429)' "$start_log"; then
              echo "::notice::Supabase startup category: container registry throttling"
            elif grep -qiE '(connection refused|timed out|context deadline exceeded|TLS handshake timeout)' "$start_log"; then
              echo "::notice::Supabase startup category: container network timeout"
            elif grep -qiE '(unauthorized|denied|forbidden)' "$start_log"; then
              echo "::notice::Supabase startup category: registry authorization"
            else
              echo "::notice::Supabase startup category: undetermined; inspect CI runner and container health"
            fi
            echo "::notice::Sanitized Supabase error summary (first five matching lines):"
            grep -iE '(error|failed|invalid|unknown|panic|docker|cannot|timeout)' "$start_log" |
              sed -E 's/eyJ[A-Za-z0-9_.-]+/[JWT_REDACTED]/g; s/sb_(publishable|secret)_[A-Za-z0-9_-]+/[KEY_REDACTED]/g; s#postgres(ql)?://[^ ]+#[DB_URI_REDACTED]#g; s#https?://[^ ]+#[URL_REDACTED]#g; s/[A-Za-z0-9_+\/=-]{80,}/[LONG_TOKEN_REDACTED]/g' |
              head -n 5 || true
            # Only emit narrowly filtered migration/SQL failure diagnostics.
            # Never dump the full log (which may contain local test keys).
            echo "::notice::Sanitized migration/SQL startup diagnostics:"
            grep -Ei 'applying migration|migration .*\.sql|^error:|^failed |^fatal:|^panic:|sqlstate|^\s*error:' "$start_log" |
              sed -E 's/eyJ[A-Za-z0-9_.-]+/[JWT_REDACTED]/g; s/sb_(publishable|secret)_[A-Za-z0-9_-]+/[KEY_REDACTED]/g; s#postgres(ql)?://[^ ]+#[DB_URI_REDACTED]#g; s#https?://[^ ]+#[URL_REDACTED]#g; s/[A-Za-z0-9_+\/=:-]{80,}/[LONG_TOKEN_REDACTED]/g' |
              tail -n 12 || true
            # Startup/migration failures can omit the words 'error' and
            # 'failed'. Provide only sanitized, short terminal context.
            echo "::notice::Sanitized final migration context (no keys/URLs):"
            tail -n 24 "$start_log" |
              sed -E 's/eyJ[A-Za-z0-9_.-]+/[JWT_REDACTED]/g; s/sb_(publishable|secret)_[A-Za-z0-9_-]+/[KEY_REDACTED]/g; s#postgres(ql)?://[^ ]+#[DB_URI_REDACTED]#g; s#https?://[^ ]+#[URL_REDACTED]#g; s/[A-Za-z0-9_+\/=:-]{60,}/[LONG_TOKEN_REDACTED]/g' |
              grep -viE 'service_role key|anon key|access_token|refresh_token|jwt secret|database password|supabase_service_role|supabase_anon_key|^ *apikey' |
              tail -n 12 | cut -c 1-300 || true
            docker ps -a --filter name=tutor_v4_isolated --format 'container={{.Names}} state={{.Status}}' || true
            exit 1
          fi
          if ! supabase db reset --local --no-seed >"$reset_log" 2>&1; then
            echo "::error::Disposable Supabase migration replay failed (output suppressed)"
            exit 1
          fi
          echo "Disposable local Supabase ready; no hosted project touched"
      - name: Assert clean V4 plus V5 schema, RLS, RPC grants and zero-row baseline
        run: |
          set -euo pipefail
          test "$CI" = "true"
          test "$V4_E2E_LOCAL" = "1"
          # Hosted-link checks already ran before Supabase startup. The gate
          # itself only uses docker exec against the disposable local container.
          node tests/local/v5-clean-bootstrap-gate.mjs
      - name: Reproduce Production-like legacy payment SELECT only in disposable CI
        run: |
          set -euo pipefail
          grep -q '^project_id = "tutor_v4_isolated"$' supabase/config.toml
          test ! -f supabase/.temp/project-ref
          docker exec -i supabase_db_tutor_v4_isolated psql \
            -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < tests/sql/v4_local_legacy_parent_payment_policies.sql >/dev/null
      - name: Exercise standalone P0 hotfix with real local GoTrue JWT before and after unlink
        env:
          V359_LOCAL_RLS_TEST: '1'
          V359_RLS_PREAPPLIED: '0'
          V359_RLS_STANDALONE_HOTFIX: '1'
        run: node tests/local/v359-parent-payment-rest.mjs
      - name: Reset disposable database after standalone P0 hotfix proof
        run: |
          set -euo pipefail
          reset_log="$RUNNER_TEMP/v4-standalone-hotfix-reset.log"
          trap 'rm -f "$reset_log"' EXIT
          if ! supabase db reset --local --no-seed >"$reset_log" 2>&1; then
            echo "::error::Disposable Supabase reset after P0 hotfix test failed"
            exit 1
          fi
          echo "CI-only Supabase reset complete; original V4 tests start from clean baseline"
      - name: Run original V4 GoTrue JWT and REST contract suite on disposable database
        env:
          V359_LOCAL_RLS_TEST: '1'
          V359_RLS_PREAPPLIED: '1'
          V40_LOCAL_METADATA_TEST: '1'
          V40_LOCAL_CONTACT_TEST: '1'
          V40_LOCAL_CORRECTION_TEST: '1'
          V40_LOCAL_CONTACT_TRACKING_TEST: '1'
        run: |
          set -euo pipefail
          node tests/local/v40-contact-rest.mjs
          node tests/local/v359-parent-payment-rest.mjs
          node tests/local/v40-qa-time-rest.mjs
          node tests/local/v40-payment-correction-rest.mjs
          node tests/local/v40-contact-tracking-rest.mjs
      - name: Real three-role shared-course CRUD, recurring schedules and unlink permissions
        env:
          V4_SHARED_COURSE_LOCAL_TEST: '1'
        run: node tests/local/v4-shared-course-rest.mjs
      - name: Reset only disposable CI database before QA suite
        run: |
          set -euo pipefail
          reset_log="$RUNNER_TEMP/ci-qa-replay.log"
          trap 'rm -f "$reset_log"' EXIT
          if ! supabase db reset --local --no-seed >"$reset_log" 2>&1; then
            echo "::error::Disposable QA replay failed (output suppressed)"
            exit 1
          fi
          echo "CI-only QA isolation reset complete"
      - name: Apply proposed QA classification SQL only to disposable database
        run: |
          set -euo pipefail
          for file in \
            supabase/candidates/20261028_v4_payment_batch_qa_classification.sql \
            supabase/candidates/20261029_v4_qa_lesson_and_legacy_receipt.sql \
            supabase/candidates/20261029_v4_accounting_qa_snapshot_rpc.sql \
            supabase/candidates/20261029_v4_qa_real_payment_rpc_reconciliation.sql \
            supabase/candidates/20261029_v4_qa_reclassification_guard.sql; do
            docker exec -i supabase_db_tutor_v4_isolated psql \
              -v ON_ERROR_STOP=1 -U postgres -d postgres < "$file" >/dev/null
          done
      - name: Diagnose complete Production 43-history V4 catalog against clean V4+V5
        run: |
          set -euo pipefail
          test "$CI" = "true"
          test "$V4_E2E_LOCAL" = "1"
          # Diagnostic-only: any drift is explicitly NO-GO in the JSON result.
          # No linked/remote DB is accessed; only disposable Docker Postgres.
          node tests/local/v5-production-schema-fingerprint-compare.mjs
      - name: Explain V4 function body, security, search_path and grant drift (metadata-only)
        run: |
          set -euo pipefail
          test "$CI" = "true"
          test "$V4_E2E_LOCAL" = "1"
          node tests/local/v5-production-function-drift-review.mjs
      - name: Assert full V4 catalog parity after isolated service_role grant overlay
        run: |
          set -euo pipefail
          test "$CI" = "true"
          test "$V4_E2E_LOCAL" = "1"
          test ! -f supabase/.temp/project-ref
          node tests/local/v5-v4-service-role-grant-parity.mjs
      - name: Real GoTrue JWT and PostgREST QA classification, RLS and unlink acceptance
        env:
          V4_QA_LOCAL_JWT_TEST: '1'
        run: node tests/local/v4-qa-classification-rest.mjs
      - name: Real GoTrue JWT Taipei-date parent payment and teacher receipt E2E
        env:
          V4_PAYMENT_TAIPEI_LOCAL_TEST: '1'
        run: node tests/local/v4-payment-date-taipei-rest.mjs
      - name: Real local JWT parent and teacher mixed QA/genuine payment reconciliation
        env:
          V4_QA_REAL_PAYMENT_TEST: '1'
        run: node tests/local/v4-qa-real-payment-rest.mjs
      - name: Real local JWT over-allocation, QA unmarking, and old-batch unlink RLS
        env:
          V4_QA_PAYMENT_RPC_TEST: '1'
        run: node tests/local/v4-qa-payment-rpc-rest.mjs
      - name: Compare current V4 schema shape against PII-free Production 43-migration snapshot
        id: v5_catalog_probe
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$V4_E2E_LOCAL" = "1"
          test ! -f supabase/.temp/project-ref
          node tests/local/v5-production-schema-catalog-compare.mjs
      - name: Install pinned Playwright and site Supabase bundle
        run: |
          npm install --no-save --no-package-lock \
            @playwright/test@1.64.1 @supabase/supabase-js@2.76.1
          npx playwright install --with-deps chromium
      - name: Probe optional V5.8 parent project finance SQL only in disposable DB
        run: |
          set -euo pipefail
          test "$CI" = "true" || { echo "::error::Candidate must run in CI"; exit 1; }
          test "$V4_E2E_LOCAL" = "1" || { echo "::error::Candidate requires disposable local test environment"; exit 1; }
          grep -Fq 'project_id = "tutor_v4_isolated"' supabase/config.toml || { echo "::error::Candidate project ID is not isolated"; exit 1; }
          test ! -f supabase/.temp/project-ref || { echo "::error::Candidate blocked: checkout is linked to a hosted Supabase ref"; exit 1; }
          # The localhost Supabase CLI can create .branches/_current_branch after start.
          # Initial pre-start unlinked-project check above already blocked hosted links.
          # SQL execution below names only the disposable local Docker container.
          candidate="supabase/candidates/20261116100000_v5_8_parent_project_scoped_receivables.sql"
          if [ -f "$candidate" ]; then
            echo "Isolated candidate target: local named Supabase container"
            docker exec -i supabase_db_tutor_v4_isolated psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$candidate" >/dev/null
            echo "V58_PROJECT_SQL_CANDIDATE=1" >> "$GITHUB_ENV"
            echo "Candidate applied to disposable local DB only; hosted database unchanged"
          else
            echo "No optional V5.8 SQL candidate; baseline unchanged"
          fi
      - name: Seed only synthetic teachers, parents, students and lessons
        run: node tests/e2e/seed-v4-local.mjs
      - name: Verify real Chromium teacher-parent-student flows
        run: npx playwright test --config tests/e2e/playwright.config.mjs
      - name: Verify failed migration rollback, retry and idempotency
        id: v5_atomicity_probe
        # A flaky pre-existing Chromium flow must not suppress independent
        # isolated migration/restore gates. Both must still pass for RAP-12.
        if: ${{ always() && steps.v5_catalog_probe.outcome == 'success' }}
        run: bash tests/local/v5-migration-atomicity-smoke.sh
      - name: Rehearse strict app-owned ACL restore with platform owner limitations disclosed
        id: v5_restore_probe
        if: ${{ always() && steps.v5_catalog_probe.outcome == 'success' }}
        continue-on-error: true
        run: bash tests/local/v5-disposable-backup-restore-smoke.sh
      - name: Enforce V5 schema catalog and application-scope restore probes
        if: always()
        run: |
          test "${{ steps.v5_catalog_probe.outcome }}" = "success" || {
            echo "::error::V5 schema catalog mismatch or probe was skipped"
            exit 1
          }
          test "${{ steps.v5_restore_probe.outcome }}" = "success" || {
            echo "::error::Synthetic application-owned schema/ACL restore failed or was skipped"
            exit 1
          }
      - name: Prepare RAP-12 disposable three-account Team GUI fixture
        id: rap12_fixture
        # A pre-existing browser regression must not hide RAP-12 evidence.
        # But the disposable schema, atomic migration and ACL restore probes
        # must ALL succeed; an unrelated browser failure still fails this job.
        if: ${{ always() && steps.v5_catalog_probe.outcome == 'success' && steps.v5_atomicity_probe.outcome == 'success' && steps.v5_restore_probe.outcome == 'success' }}
        env:
          RAP12_TEAM_GUI_LOCAL: '1'
          RAP12_FIXTURE_FILE: /tmp/rap12-team-gui-fixture.json
        run: |
          set -euo pipefail
          test "$V4_E2E_LOCAL" = "1"
          test ! -f supabase/.temp/project-ref
          node tests/e2e/seed-rap12-team-local.mjs
      - name: Verify RAP-12 true manager/teacher/foreign Team GUI and RLS
        id: rap12_gui
        if: ${{ always() && steps.rap12_fixture.outcome == 'success' }}
        env:
          RAP12_TEAM_GUI_LOCAL: '1'
          RAP12_FIXTURE_FILE: /tmp/rap12-team-gui-fixture.json
        run: |
          set -euo pipefail
          npx playwright test --config tests/e2e/rap12.config.mjs
      - name: Audit RAP-12 synthetic screenshots before upload
        id: rap12_artifact_audit
        if: ${{ always() && steps.rap12_gui.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,struct
          folder=Path('tests/e2e/test-results/rap12-e2e-artifacts')
          assert folder.is_dir(), 'Missing RAP-12 evidence directory'
          files=[p for p in folder.rglob('*') if p.is_file()]
          pngs=[p for p in files if p.suffix=='.png']
          # Playwright writes its own hidden .last-run.json into outputDir;
          # this is runner metadata, NEVER included in the uploaded PNG glob.
          metadata=[p for p in files if p.suffix!='.png']
          unexpected=[p for p in metadata if p.name!='.last-run.json']
          assert not unexpected,f'Unexpected non-PNG evidence: {[p.name for p in unexpected]}'
          assert len(metadata)<=1,f'Unexpected runner metadata count: {len(metadata)}'
          # Seven allowed Team scenes x five widths x page/card (70).
          # Four phone widths x seven bottom viewports (28) + four billing notes.
          scenes=('managerA-projects','managerA-learning','managerA-billing',
                  'teacherA-projects','teacherA-learning',
                  'managerB-projects','managerB-learning')
          widths=(320,375,390,430,1440)
          mobile=(320,375,390,430)
          allowed={f'{scene}-{width}-{kind}.png'
                   for scene in scenes for width in widths for kind in ('page','card')}
          allowed.update(f'{scene}-{width}-viewport-bottom.png'
                         for scene in scenes for width in mobile)
          allowed.update(f'managerA-billing-{width}-viewport-copy-end.png'
                         for width in mobile)
          expected=102
          assert len(allowed)==expected,'RAP-12 expected screenshot matrix is inconsistent'
          names=[p.name for p in pngs]
          assert len(pngs)==expected, f'Expected {expected} synthetic PNGs, found {len(pngs)}'
          assert len(set(names))==expected,'Duplicate RAP-12 PNG filenames are forbidden'
          assert set(names)==allowed, (
           f'RAP-12 screenshot matrix mismatch, missing={sorted(allowed-set(names))}, '
           f'extra={sorted(set(names)-allowed)}')
          for file in pngs:
           with file.open('rb') as stream: head=stream.read(24)
           assert head[:8]==bytes.fromhex('89504e470d0a1a0a'),f'Invalid PNG signature: {file.name}'
           width,height=struct.unpack('>II',head[16:24])
           expected_width=int(file.name.split('-')[2])
           assert width>0 and height>0, f'Empty PNG geometry: {file.name}'
           if '-viewport-' in file.name:
            assert width==expected_width and height==844,f'Unexpected viewport dimensions: {file.name} ({width}x{height})'
           elif file.name.endswith('-page.png'):
            assert width==expected_width and height>=844,f'Unexpected full-page dimensions: {file.name} ({width}x{height})'
          assert not list(folder.rglob('trace.zip')), 'Raw Playwright trace must never be uploaded'
          print(f'RAP12_ARTIFACT_AUDIT PASS png_count={len(pngs)} runner_metadata={len(metadata)} png_only_upload=true trace=false')
          PY
      - name: Upload RAP-12 synthetic-only three-identity screenshots
        if: ${{ always() && steps.rap12_artifact_audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rap12-isolated-team-gui
          # Explicit PNG-only glob: do not upload the runner's .last-run.json,
          # HTML reports, logs, tokens or Playwright traces.
          path: tests/e2e/test-results/rap12-e2e-artifacts/**/*.png
          retention-days: 7
          if-no-files-found: error
      - name: Upload synthetic-only V5 Alpha multi-role RWD evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v5-alpha-synthetic-rwd
          path: tests/e2e/test-results/v4-e2e-artifacts/v5-alpha-rwd-*.png
          retention-days: 7
          if-no-files-found: error
      - name: Remove ephemeral auth fixture
        if: always()
        run: rm -f "$V4_E2E_FIXTURE_FILE" /tmp/rap12-team-gui-fixture.json
      - name: Upload sanitized failure screenshots and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v4-browser-e2e-failures
          path: |
            tests/e2e/test-results/v4-e2e-report/
            tests/e2e/test-results/v4-e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore
